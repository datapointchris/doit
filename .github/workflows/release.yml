name: Release

on:
  push:
    branches: [main]

# Two pushes to main inside one run's window would otherwise race. Both runs
# resolve the same version, and the later one fails pushing its tag.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write

  # In the same workflow as the release, because a tag pushed with
  # GITHUB_TOKEN starts no other workflow run. The shared workflow is a job
  # apart from the release, so the index credentials reach its steps alone.
  #
  # It skips each file the index already holds, so re-running a publish that
  # failed partway uploads the rest.
  #
  # A commit that bumps nothing leaves `released` false, and this is skipped.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: datapointchris/reusable-workflows/.github/workflows/python-publish.yml@v1
    with:
      tag: ${{ needs.release.outputs.tag }}
      publish-url: https://pypi.ichrisbirch.com/
      check-url: https://pypi.ichrisbirch.com/simple/
    secrets:
      username: ${{ secrets.PYPI_ICB_USERNAME }}
      password: ${{ secrets.PYPI_ICB_PASSWORD }}

  # The Go doit's stream, tagged cli/vX.Y.Z from the conventional commits under
  # cli/. Its release carries doit_<version>_<os>_<arch>.tar.gz for each desk,
  # with the binary at the archive's root, and checksums.txt. `doit update` and
  # a machine's package manager install from those. `go install
  # .../cli/cmd/doit-tui@latest` resolves these tags through the module proxy. The release is not marked latest, so the Python package's own
  # stays the one GitHub shows.
  #
  # The tag is not pushed here. It lands with the release, so a failed build
  # leaves no tag, and the next run cuts the same version again.
  cli-version:
    name: Resolve the Go doit's version
    needs: validate
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.cli.outputs.tag }}
      previous: ${{ steps.cli.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install svu
        run: |
          release/install-tools "$RUNNER_TEMP/bin" svu
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Resolve the Go doit's version
        id: cli
        run: release/resolve-version --prefix cli/v --path cli >>"$GITHUB_OUTPUT"

  cli-build:
    name: Build the Go doit for ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: cli-version
    if: needs.cli-version.outputs.tag != ''
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cli/web/package-lock.json

      # The binary embeds the panel page from cli/internal/panelpage/dist, which a
      # checkout holds only as a placeholder. A binary built without this build
      # would serve that placeholder, so a dist still carrying its marker fails
      # the release.
      - name: Build the panel page
        working-directory: cli/web
        run: |
          npm ci
          npm run build
          if grep -q 'name="doit-panel-page" content="placeholder"' ../internal/panelpage/dist/index.html; then
            echo "::error::cli/internal/panelpage/dist/index.html is still the placeholder after the page's build"
            exit 1
          fi

      # goselfupdate matches the OS and the Go arch as delimited words in an
      # asset's name, so the underscores are what make it findable. CGO is off,
      # so the binary runs on a desk without the build host's libc.
      - name: Build and archive
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.cli-version.outputs.tag }}
        run: |
          version="${TAG#cli/}"
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o ../dist/doit ./cmd/doit
          tar -czf "../dist/doit_${version#v}_${GOOS}_${GOARCH}.tar.gz" -C ../dist doit
          rm ../dist/doit

      # The publish job attaches these in this run, so a day outlives every use.
      - uses: actions/upload-artifact@v7
        with:
          name: doit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # After the Python release reaches the index, whose doit-python a desk
  # installs before this binary takes the name doit. A push that cut no Python
  # release skips publish, and a failed or cancelled upload holds this back.
  cli-publish:
    name: Publish the Go doit's release
    needs: [release, publish, cli-version, cli-build]
    if: >-
      always() && needs.release.result == 'success' && needs.cli-build.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    env:
      TAG: ${{ needs.cli-version.outputs.tag }}
      PREVIOUS: ${{ needs.cli-version.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: doit-*
          path: dist
          merge-multiple: true

      # `--` rather than `./*`, because sha256sum echoes its argument and the
      # release asset is named `name`, not `./name`.
      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz >checksums.txt

      - name: Build release notes
        run: |
          git log --no-merges --pretty='- %s (%h)' "${PREVIOUS:+${PREVIOUS}..}HEAD" -- cli >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # The run for a newer push resolves from the same previous tag, so it
      # releases these commits too. A tag already on this commit was left by a
      # publish GitHub failed partway, and the newer run refuses to version past
      # it, so this run publishes it whatever the tip.
      - name: Leave the release to a newer push
        id: tip
        run: |
          tagged=$(git ls-remote origin "refs/tags/$TAG" | tail -n 1 | cut -f1)
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "$TAG already names ${GITHUB_SHA} with no release, so this run publishes it"
            exit 0
          fi
          tip=$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)
          [ -n "$tip" ] || { echo "origin names no commit for $GITHUB_REF" >&2; exit 1; }
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF is at ${tip}, past ${GITHUB_SHA}; the run for ${tip} releases these commits"
            echo "superseded=true" >>"$GITHUB_OUTPUT"
          fi

      # gh uploads every asset to a draft and publishes it last, creating the
      # tag on this commit as it does.
      - name: Publish the release
        if: steps.tip.outputs.superseded != 'true'
        run: |
          release/publish-github-release "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest=false

  # The service's image, built from the repository root because it runs the
  # root package's view code. It is tagged by the last commit touching anything
  # it holds, so a release that changed none of it builds nothing.
  #
  # After `release`, so the version it bakes in is the tag this push cut rather
  # than the one before it.
  #
  # A push that cut a release also publishes deploy/ with that image pinned by
  # digest, as manifests:<version>. A cluster following the manifests by semver
  # deploys the release with no other step.
  api-image:
    needs: [validate, release]
    runs-on: ubuntu-26.04
    # A named bash runs with pipefail.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
      # The OIDC token cosign trades for a signing certificate naming this workflow.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/doit-api
      MANIFESTS: ghcr.io/${{ github.repository }}/manifests
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag and the version are properties of the history, which a
          # one-commit clone does not hold.
          fetch-depth: 0

      - name: Name the image by the last commit touching what it holds
        id: tag
        env:
          RELEASED: ${{ needs.release.outputs.released }}
          RELEASED_TAG: ${{ needs.release.outputs.tag }}
        run: |
          echo "tag=sha-$(git log -1 --format=%H -- api/ src/ pyproject.toml uv.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"
          if [ "$RELEASED" = true ]; then
            version=$RELEASED_TAG
          else
            version=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether that image is already published
        id: published
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:${{ steps.tag.outputs.tag }} is already published; nothing it holds changed"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.published.outputs.exists == 'false'
        with:
          context: .
          file: api/Dockerfile
          build-args: DOIT_VERSION=${{ steps.tag.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=doit-api
          cache-to: type=gha,mode=max,scope=doit-api

      # A release that built nothing reads the published image's digest.
      - name: Name the image by its digest
        id: image
        if: needs.release.outputs.released == 'true'
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pinned=$BUILT
          if [ -z "$pinned" ]; then
            pinned=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          [[ $pinned == sha256:* ]] || { echo "no digest for $IMAGE:$TAG: '$pinned'" >&2; exit 1; }
          echo "ref=$IMAGE@$pinned" >>"$GITHUB_OUTPUT"
          echo "Image \`$IMAGE@$pinned\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Install flux, kustomize and cosign
        if: needs.release.outputs.released == 'true'
        run: |
          release/install-tools "$RUNNER_TEMP/bin" flux kustomize cosign
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # Pushed as manifests:<version>. --reproducible makes a re-run send the
      # same bytes for the same digest. The source and revision travel in the
      # artifact, and Flux reports them beside what it applied.
      - name: Push the manifests
        id: manifests
        if: needs.release.outputs.released == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          work=$RUNNER_TEMP/manifests
          release/pin-manifests --image "$IMAGE_REF" --version "$VERSION" --out "$work"
          pushed=$(flux push artifact "oci://$MANIFESTS:$VERSION" --path="$work" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision="$VERSION@sha1:$GITHUB_SHA" \
            --reproducible --output=json | jq -r .digest)
          [[ $pushed == sha256:* ]] || { echo "flux push named no digest: '$pushed'" >&2; exit 1; }
          echo "ref=$MANIFESTS@$pushed" >>"$GITHUB_OUTPUT"
          echo "Manifests \`$MANIFESTS:$VERSION\` as \`$MANIFESTS@$pushed\`" >>"$GITHUB_STEP_SUMMARY"

      # Keyless, so the signing certificate names this workflow on this ref and
      # no key exists to keep. A deployment verifies the artifact against that
      # identity before applying it. A re-run signs again, and either signature
      # verifies.
      - name: Sign the image and the manifests
        if: needs.release.outputs.released == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          MANIFESTS_REF: ${{ steps.manifests.outputs.ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign sign --yes "$MANIFESTS_REF"
          cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF" "$MANIFESTS_REF" >/dev/null
