name: Release

on:
  push:
    branches: [main]

# Two pushes to main inside one run's window would otherwise race. Both runs
# resolve the same version, and the later one fails pushing its tag or its
# version commit.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  # There is no publish job. doit is installed from this repo with uv, and the
  # tag is what an install resolves against. The cards and Labs ship separately
  # in terminal-library, which is why authoring one needs no release here.
  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write
