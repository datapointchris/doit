name: Release

on:
  push:
    branches: [main]

# Two pushes to main inside one run's window would otherwise race. Both runs
# resolve the same version, and the later one fails pushing its tag or its
# version commit.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  # The cards and Labs ship separately in terminal-library, which is why
  # authoring one needs no release here.
  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write

  # A separate job in the same workflow, gated on the one above.
  #
  # Same workflow because a tag pushed with GITHUB_TOKEN does not trigger
  # another workflow run, so a publish keyed on `push: tags` would never fire.
  # Separate job so the index credentials are reachable from these steps only,
  # and not from the release job that runs python-semantic-release.
  #
  # A commit type that bumps nothing leaves `released` false, and this job is
  # skipped. A skipped publish on a green run is the correct result there.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag, not the branch. The version is read from the tag, so a
          # build anywhere else names the previous release plus a distance, and
          # main may already have moved past what was released.
          ref: ${{ needs.release.outputs.tag }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv build

      # pypiserver rejects a second upload of a filename it already holds and
      # offers no yank, so the sdist and wheel are checked while the upload is
      # still avoidable.
      - run: uv run --no-project --with twine twine check dist/*

      - name: Publish to pypi.ichrisbirch.com
        run: uv publish --publish-url https://pypi.ichrisbirch.com/
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_ICB_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_ICB_PASSWORD }}

  # The service's image, built from the repository root because it runs the
  # root package's view code. It is tagged by the last commit touching anything
  # it holds, so a release that changed none of it builds nothing.
  #
  # After `release`, so the version it bakes in is the tag this push cut rather
  # than the one before it.
  api-image:
    needs: [validate, release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/doit-api
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag and the version are properties of the history, which a
          # one-commit clone does not hold.
          fetch-depth: 0

      - name: Name the image by the last commit touching what it holds
        id: tag
        env:
          RELEASED: ${{ needs.release.outputs.released }}
          RELEASED_TAG: ${{ needs.release.outputs.tag }}
        run: |
          echo "tag=sha-$(git log -1 --format=%H -- api/ src/ pyproject.toml | cut -c1-12)" >> "$GITHUB_OUTPUT"
          if [ "$RELEASED" = true ]; then
            version=$RELEASED_TAG
          else
            version=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether that image is already published
        id: published
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:${{ steps.tag.outputs.tag }} is already published; nothing it holds changed"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.exists == 'false'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.published.outputs.exists == 'false'
        with:
          context: .
          file: api/Dockerfile
          build-args: DOIT_VERSION=${{ steps.tag.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=doit-api
          cache-to: type=gha,mode=max,scope=doit-api
