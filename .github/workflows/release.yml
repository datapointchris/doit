name: Release

on:
  push:
    branches: [main]

# Two pushes to main inside one run's window would otherwise race. Both runs
# resolve the same version, and the later one fails pushing its tag.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write

  # In the same workflow as the release, because a tag pushed with
  # GITHUB_TOKEN starts no other workflow run. The shared workflow is a job
  # apart from the release, so the index credentials reach its steps alone.
  #
  # It skips each file the index already holds, so re-running a publish that
  # failed partway uploads the rest.
  #
  # A commit that bumps nothing leaves `released` false, and this is skipped.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: datapointchris/reusable-workflows/.github/workflows/python-publish.yml@v1
    with:
      tag: ${{ needs.release.outputs.tag }}
      publish-url: https://pypi.ichrisbirch.com/
      check-url: https://pypi.ichrisbirch.com/simple/
    secrets:
      username: ${{ secrets.PYPI_ICB_USERNAME }}
      password: ${{ secrets.PYPI_ICB_PASSWORD }}

  # The service's image, built from the repository root because it runs the
  # root package's view code. It is tagged by the last commit touching anything
  # it holds, so a release that changed none of it builds nothing.
  #
  # After `release`, so the version it bakes in is the tag this push cut rather
  # than the one before it.
  #
  # A push that cut a release also publishes deploy/ with that image pinned by
  # digest, as manifests:<version>. A cluster following the manifests by semver
  # deploys the release with no other step.
  api-image:
    needs: [validate, release]
    runs-on: ubuntu-26.04
    # A named bash runs with pipefail.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
      # The OIDC token cosign trades for a signing certificate naming this workflow.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/doit-api
      MANIFESTS: ghcr.io/${{ github.repository }}/manifests
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag and the version are properties of the history, which a
          # one-commit clone does not hold.
          fetch-depth: 0

      - name: Name the image by the last commit touching what it holds
        id: tag
        env:
          RELEASED: ${{ needs.release.outputs.released }}
          RELEASED_TAG: ${{ needs.release.outputs.tag }}
        run: |
          echo "tag=sha-$(git log -1 --format=%H -- api/ src/ pyproject.toml | cut -c1-12)" >> "$GITHUB_OUTPUT"
          if [ "$RELEASED" = true ]; then
            version=$RELEASED_TAG
          else
            version=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether that image is already published
        id: published
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:${{ steps.tag.outputs.tag }} is already published; nothing it holds changed"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.published.outputs.exists == 'false'
        with:
          context: .
          file: api/Dockerfile
          build-args: DOIT_VERSION=${{ steps.tag.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=doit-api
          cache-to: type=gha,mode=max,scope=doit-api

      # A release that built nothing reads the published image's digest.
      - name: Name the image by its digest
        id: image
        if: needs.release.outputs.released == 'true'
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pinned=$BUILT
          if [ -z "$pinned" ]; then
            pinned=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          [[ $pinned == sha256:* ]] || { echo "no digest for $IMAGE:$TAG: '$pinned'" >&2; exit 1; }
          echo "ref=$IMAGE@$pinned" >>"$GITHUB_OUTPUT"
          echo "Image \`$IMAGE@$pinned\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Install flux, kustomize and cosign
        if: needs.release.outputs.released == 'true'
        run: |
          release/install-tools "$RUNNER_TEMP/bin" flux kustomize cosign
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # Pushed as manifests:<version>. --reproducible makes a re-run send the
      # same bytes for the same digest. The source and revision travel in the
      # artifact, and Flux reports them beside what it applied.
      - name: Push the manifests
        id: manifests
        if: needs.release.outputs.released == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          work=$RUNNER_TEMP/manifests
          release/pin-manifests --image "$IMAGE_REF" --version "$VERSION" --out "$work"
          pushed=$(flux push artifact "oci://$MANIFESTS:$VERSION" --path="$work" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision="$VERSION@sha1:$GITHUB_SHA" \
            --reproducible --output=json | jq -r .digest)
          [[ $pushed == sha256:* ]] || { echo "flux push named no digest: '$pushed'" >&2; exit 1; }
          echo "ref=$MANIFESTS@$pushed" >>"$GITHUB_OUTPUT"
          echo "Manifests \`$MANIFESTS:$VERSION\` as \`$MANIFESTS@$pushed\`" >>"$GITHUB_STEP_SUMMARY"

      # Keyless, so the signing certificate names this workflow on this ref and
      # no key exists to keep. A deployment verifies the artifact against that
      # identity before applying it. A re-run signs again, and either signature
      # verifies.
      - name: Sign the image and the manifests
        if: needs.release.outputs.released == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          MANIFESTS_REF: ${{ steps.manifests.outputs.ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign sign --yes "$MANIFESTS_REF"
          cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF" "$MANIFESTS_REF" >/dev/null
