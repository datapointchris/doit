[project]
name = "doit"
version = "0.1.0"
description = "The layer that decides what to attend to and drives it"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["cli", "attention", "dashboard", "spaced-repetition", "cadence", "dotfiles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# The application floor, matching the PEP 723 headers the scripts carried in
# dotfiles. menu-dashboard needs StrEnum (3.11), so 3.12 is already headroom.
requires-python = ">=3.12"

# typer owns the command tree and rich renders everything, matching
# syncer/indy/relate/ypl/dectl. rich is declared rather than leaned on as typer's
# transitive dependency, because doit uses Console directly and a reader should
# not have to check typer's pins to learn that.
#
# Not pytermstyle: a standalone CLI standardizes on rich's display semantics, and
# pytermstyle is for the in-repo dotfiles apps sharing a palette with colors.sh.
# See ~/dev/standards/cli-design.md § "Python CLIs are typer, and their help is
# rich's".
#
# pyselfupdate arrives with the release that needs updating.
dependencies = ["typer>=0.15.0", "rich>=13.0.0", "pyyaml"]

[project.scripts]
doit = "doit.cli:main"

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.codespell]
check-filenames = true

[tool.pytest.ini_options]
addopts = "-vv"
minversion = "8.0"
testpaths = ["tests"]

[tool.forge]
# Keys the standard owns, written by `forge dies run maintenance/sync-pyproject.sh`.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "addopts"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
