[project]
name = "doit"
dynamic = ["version"]
description = "doit's rules: the balances, due dates, lanes and draws that its service computes every view with"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["attention", "dashboard", "spaced-repetition", "cadence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# The service in api/ is its one caller, and runs it on the image's Python.
requires-python = ">=3.13"

# pyyaml's floor is the first release with wheels for this Python.
dependencies = [
    "pyyaml>=6.0.2",
]

[tool.ruff]
line-length = 140
extend-exclude = ["*.md"]
# Where isort finds the first-party packages: `doit` at the root and `doit_api`
# in the workspace's api/ member.
src = [".", "src", "api/src"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "ICN",  # flake8-import-conventions
    # flake8-bandit by rule, never as the family. Most of what the family
    # reports is a subprocess call made on purpose, and silencing that takes an
    # ignore list that grows with every project.
    "S102",  # exec
    "S113",  # an HTTP request with no timeout, which can hang forever
    "S301",  # pickle, which runs code from the bytes it loads
    "S307",  # eval
    "S324",  # md5 or sha1 used for security
    "S501",  # TLS certificate verification turned off
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "pyspark.sql.functions", "pyspark.sql.types"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
datetime = "dt"
sqlalchemy = "sa"
"pyspark.sql.functions" = "sf"
"pyspark.sql.types" = "st"
dataclasses = "dc"

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false
# tests/ and api/tests each hold a conftest.py and no __init__.py, so `mypy .`
# maps both to the module `conftest` and aborts. Deriving names from the path
# makes them tests.conftest and api.tests.conftest.
explicit_package_bases = true
# The src directories resolve `doit.*` and `doit_api.*` to the packages. Without
# them, ignore_missing_imports turns every first-party import into `Any`.
mypy_path = ["src", "api/src"]

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.bandit]
exclude_dirs = ["tests"]
# The draw picks at random by design, so the PRNG check fires on the design
# rather than on a defect.
skips = ["B311"]

[tool.codespell]
check-filenames = true
check-hidden = true
builtin = "clear,rare"
uri-ignore-words-list = "*"
# A recorded screen cuts words at the terminal's edge, and the replay compares
# the cut as printed, so a respelled fragment fails the test it records.
skip = "cli/internal/screens/testdata/*.txt"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
verbosity_assertions = 2

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "extend-exclude"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "flake8-import-conventions", "banned-from"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "datetime"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "dataclasses"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "sqlalchemy"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.functions"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.types"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["codespell", "check-hidden"],
    ["codespell", "builtin"],
    ["codespell", "uri-ignore-words-list"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]
# Dependencies held at the version the pre-commit hook runs, in every group
# and extra that names them, so a local run and CI cannot disagree.
pinned = ["ruff"]

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "jsonschema>=4.0",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.17.1",
]

# The release tag is the version. python-semantic-release finds no file to
# stamp, so it tags the merge commit itself and writes no release commit.
# uv_build cannot do this: its metadata has no dynamic version field.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "semver"

# A new commit or tag changes the version, so it has to invalidate uv's cache.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# The service in api/ is a member, so the rules and the service install from one
# lock here. The rules stay the root project and never pull the service's web stack.
[tool.uv.workspace]
members = ["api"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.semantic_release]
# A feature release on 0.x stays on 0.x. python-semantic-release v10 defaults
# this to false, which makes the next release of a 0.x project 1.0.0.
allow_zero_version = true
# 1.0 is a compatibility promise, so a breaking change on 0.x is a minor bump.
# Removing this key is how the project reaches 1.0.
major_on_zero = false
