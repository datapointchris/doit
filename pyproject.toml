[project]
name = "doit"
version = "5.0.0"
description = "The layer that decides what to attend to and drives it"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["cli", "attention", "dashboard", "spaced-repetition", "cadence", "dotfiles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# The application floor, matching the PEP 723 headers the scripts carried in
# dotfiles. menu-dashboard needs StrEnum (3.11), so 3.12 is already headroom.
requires-python = ">=3.12"

# typer owns the command tree and rich renders everything, matching
# syncer/indy/ypl/dectl. rich is declared rather than leaned on as typer's
# transitive dependency, because doit uses Console directly and a reader should
# not have to check typer's pins to learn that.
#
# Not pytermstyle: a standalone CLI standardizes on rich's display semantics, and
# pytermstyle is for the in-repo dotfiles apps sharing a palette with colors.sh.
#
# The [typer] extra is the ready-made `doit update`; safekeep declines it only
# because it is argparse. Resolved from PyPI, where the name was free.
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml",
    "pyselfupdate[typer]>=0.5.0",
]

[project.scripts]
doit = "doit.cli:main"

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "ICN",  # flake8-import-conventions
    # flake8-bandit by rule, never as the family. Most of what the family
    # reports is a subprocess call made on purpose, and silencing that takes an
    # ignore list that grows with every project.
    "S102",  # exec
    "S113",  # an HTTP request with no timeout, which can hang forever
    "S301",  # pickle, which runs code from the bytes it loads
    "S307",  # eval
    "S324",  # md5 or sha1 used for security
    "S501",  # TLS certificate verification turned off
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "pyspark.sql.functions", "pyspark.sql.types"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
datetime = "dt"
sqlalchemy = "sa"
"pyspark.sql.functions" = "sf"
"pyspark.sql.types" = "st"

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.bandit]
exclude_dirs = ["tests"]
# doit's whole job is running other CLIs and drawing at random, so the subprocess
# and PRNG checks fire on the design rather than on a defect. Same set safekeep
# and syncer carry for the same reason. The one call that reaches a shell is
# suppressed at its line instead, because there it is a real question.
skips = ["B311", "B404", "B603", "B607"]

[tool.codespell]
check-filenames = true
check-hidden = true
builtin = "clear,rare"
uri-ignore-words-list = "*"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
verbosity_assertions = 2

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "flake8-import-conventions", "banned-from"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "datetime"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "sqlalchemy"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.functions"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.types"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["codespell", "check-hidden"],
    ["codespell", "builtin"],
    ["codespell", "uri-ignore-words-list"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]
# Dependencies held at the version the pre-commit hook runs, in every group
# and extra that names them, so a local run and CI cannot disagree.
pinned = ["ruff"]

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.12.5",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "build(release): {version}"
# The package name is hardcoded because python-semantic-release sets no
# $PACKAGE_NAME; the variable form silently no-ops and ships a stale uv.lock.
# Reads the uv-lock hook's rev, the one uv release every uv.lock writer runs.
build_command = '''
    pip install "uv==$(python -c 'import re; print(re.search(r"uv-pre-commit\s+rev: \"?([\w.]+)", open(".pre-commit-config.yaml").read())[1])')"
    uv lock --upgrade-package doit
    git add uv.lock
'''

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
