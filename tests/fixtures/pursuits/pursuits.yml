# Fixture register for tests/test_pursuits.py. Deliberately covers one of
# each shape: counted pursuits on cadences of different lengths, one measured in
# minutes a week, a paused entry, and a term that has already ended.
pursuits:
  chores:
    description: The maintenance list
    weight: 25
    cadence: 7d

  read-library:
    description: Read what is on the shelf
    weight: 30
    weekly_minutes: 45

  read-longform:
    description: Shares a prefix with read-library, to test ambiguity
    weight: 5
    cadence: 9d

  study-computer-science:
    description: Work the CS track
    weight: 35
    cadence: 2d

  paused-thing:
    description: Kept in the file, out of the draw
    weight: 50
    cadence: 3d
    paused: true

  expired-thing:
    description: Its term has ended
    weight: 60
    cadence: 3d
    until: 2020-01-01
