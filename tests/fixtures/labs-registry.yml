version: "1.0"
tools:
  fd:
    description: find files
    tags: [search, files]
    examples:
      - cmd: fd -e go
        desc: find Go files
      - cmd: fd -H log
        desc: include hidden and ignored
  rg:
    description: search code
    tags: [search, code]
    examples:
      - cmd: rg -w timeout
        desc: whole-word match
  noexamples:
    description: a tool with no examples
    tags: [misc]
    examples: []
